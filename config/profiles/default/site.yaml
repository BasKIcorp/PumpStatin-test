layout:
  header:
    logo:
      src: /logo.svg
      width: 180
      link: /home
    menu:
    - label: Главная
      pageId: home
    - label: О компании
      pageId: about
    - label: Каталог
      pageId: catalog
    - label: Подбор насосов
      pageId: wizard
    loginButton: true
  footer:
    columns:
    - title: Продукты
      links:
      - label: Подбор насосов
        pageId: wizard
      - label: Каталог
        pageId: catalog
    - title: Компания
      links:
      - label: О нас
        pageId: about
      - label: Контакты
        pageId: contact
    - title: Помощь
      links:
      - label: Кабинет
        pageId: cabinet
    copyright: © PumpStation. Все права защищены.
pages:
- id: login
  title: Вход
  route: /login
  inMenu: false
  type: auth
  pageProfile: auth-minimal
  grid:
    cols: 12
    rowHeight: 40
  blocks:
  - id: login-brand
    type: auth/brand-panel
    layout:
      x: 1
      y: 1
      w: 5
      h: 17
    props: {}
  - id: login-form
    type: auth/login-form
    layout:
      x: 7
      y: 3
      w: 4
      h: 5
    props:
      title: Вход
  - id: login-quick
    type: auth/quick-login
    layout:
      x: 7
      y: 8
      w: 4
      h: 6
    props: {}
  - id: login-admin
    type: auth/admin-entry
    layout:
      x: 7
      y: 14
      w: 4
      h: 2
    props: {}
  - id: login-back
    type: auth/back-link
    layout:
      x: 7
      y: 16
      w: 4
      h: 1
    props: {}
- id: home
  title: Главная
  route: /home
  inMenu: true
  type: page
  pageProfile: cms-default
  blocks:
  - id: home-hero
    type: hero
    layout:
      x: 0
      y: 0
      w: 12
      h: 8
    props:
      background: '#1e4a8c'
      heading: Подбор насосных станций
      subheading: Стрела — инженерный сервис подбора оборудования
      cta:
        label: Подобрать
        pageId: wizard
- id: about
  title: О компании
  route: /about
  inMenu: true
  type: page
  pageProfile: cms-default
  blocks:
  - id: block-1781964019590
    type: divider
    props:
      style: solid
      color: '#e5e7eb'
    layout:
      x: 0
      y: 1
      w: 12
      h: 1
  - id: block-1782727321641
    type: divider
    props:
      style: solid
      color: '#e5e7eb'
    layout:
      x: 0
      y: 2
      w: 12
      h: 1
- id: catalog
  title: Каталог
  route: /catalog
  inMenu: true
  type: page
  blocks:
  - id: catalog-grid
    type: product-grid
    layout:
      x: 0
      y: 0
      w: 12
      h: 10
    props:
      columns: 3
      filter: true
- id: contact
  title: Контакты
  route: /contact
  inMenu: false
  type: page
  blocks:
  - id: contact-form
    type: contact-form
    layout:
      x: 0
      y: 0
      w: 6
      h: 8
    props:
      title: Свяжитесь с нами
  - id: contact-map
    type: map
    layout:
      x: 6
      y: 0
      w: 6
      h: 8
    props:
      address: Москва, Россия
      lat: 55.75
      lng: 37.62
  - id: block-1781978774803
    type: rich-text
    props:
      content: <p>Текст</p>
    layout:
      x: 0
      y: 8
      w: 12
      h: 4
- id: cabinet
  title: Кабинет
  route: /cabinet
  inMenu: false
  type: cabinet
  pageProfile: strela-funnel
  blocks:
  - id: cabinet-main
    type: cabinet/workspace
    layout:
      x: 0
      y: 0
      w: 12
      h: 20
    props: {}
