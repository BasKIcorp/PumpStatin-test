layout:
  header:
    logo:
      src: /logo.svg
      width: 180
      link: /home
    menu:
    - label: Главная
      pageId: home
    - label: О компании
      pageId: about
    - label: Каталог
      pageId: catalog
    - label: Подбор насосов
      pageId: wizard
    loginButton: true
  footer:
    columns:
    - title: Продукты
      links:
      - label: Подбор насосов
        pageId: wizard
      - label: Каталог
        pageId: catalog
    - title: Компания
      links:
      - label: О нас
        pageId: about
      - label: Контакты
        pageId: contact
    - title: Помощь
      links:
      - label: Кабинет
        pageId: cabinet
    copyright: © PumpStation. Все права защищены.
routing:
  landingPageId: home
pages:
- id: login
  title: Вход
  route: /login
  inMenu: false
  type: auth
  pageProfile: auth-minimal
  grid:
    cols: 12
    rowHeight: 40
  blocks:
  - id: login-brand
    type: auth/brand-panel
    layout:
      x: 0
      y: 0
      w: 8
      h: 16
    props: {}
  - id: login-form
    type: auth/login-form
    layout:
      x: 8
      y: 0
      w: 4
      h: 8
    props:
      title: Вход
  - id: login-quick
    type: auth/quick-login
    layout:
      x: 8
      y: 8
      w: 4
      h: 6
    props: {}
  - id: login-admin
    type: auth/admin-entry
    layout:
      x: 8
      y: 14
      w: 4
      h: 2
    props: {}
  - id: login-back
    type: auth/back-link
    layout:
      x: 8
      y: 16
      w: 4
      h: 1
    props: {}
- id: home
  title: Главная
  route: /home
  inMenu: true
  type: page
  pageProfile: cms-default
  blocks:
  - id: home-hero
    type: hero
    layout:
      x: 0
      y: 0
      w: 12
      h: 8
    props:
      background: '#1e4a8c'
      heading: Подбор насосных станций
      subheading: Стрела — инженерный сервис подбора оборудования
      cta:
        label: Подобрать
        pageId: wizard
- id: about
  title: О компании
  route: /about
  inMenu: true
  type: page
  pageProfile: cms-default
  blocks:
  - id: block-1781956390091
    type: divider
    layout:
      x: 0
      y: 0
      w: 12
      h: 1
    props:
      style: solid
      color: '#e5e7eb'
- id: catalog
  title: Каталог
  route: /catalog
  inMenu: true
  type: page
  blocks:
  - id: catalog-grid
    type: product-grid
    layout:
      x: 0
      y: 0
      w: 12
      h: 10
    props:
      columns: 3
      filter: true
- id: contact
  title: Контакты
  route: /contact
  inMenu: false
  type: page
  blocks:
  - id: contact-form
    type: contact-form
    layout:
      x: 0
      y: 0
      w: 6
      h: 8
    props:
      title: Свяжитесь с нами
  - id: contact-map
    type: map
    layout:
      x: 6
      y: 0
      w: 6
      h: 8
    props:
      address: Москва, Россия
      lat: 55.75
      lng: 37.62
- id: cabinet
  title: Кабинет
  route: /cabinet
  inMenu: false
  type: cabinet
  pageProfile: strela-funnel
  blocks:
  - id: cabinet-main
    type: cabinet/workspace
    layout:
      x: 0
      y: 0
      w: 12
      h: 20
    props: {}
- id: wizard
  title: Подбор насосов
  route: /wizard
  inMenu: true
  type: wizard
  pageProfile: minimal-light
  wizardRef: wizard/navigation.yaml
  blocks:
  - id: w-legacy-form
    type: wizard/legacy-selection
    layout:
      x: 0
      y: 0
      w: 12
      h: 24
    props:
      stepId: selection-form
  - id: w-heading-product-class
    type: wizard/step-heading
    layout:
      x: 0
      y: 0
      w: 12
      h: 2
    props:
      stepId: product-class
      title: null
      subtitle: null
  - id: w-card-product-class-hydromodules
    type: wizard/selection-card
    layout:
      x: 0
      y: 2
      w: 4
      h: 8
    props:
      stepId: product-class
      cardId: hydromodules
      title: Гидромодули
      description: 'Для закрытых систем вентиляции и кондиционирования. Циркуляция теплоносителя между чиллером и теплообменниками.

        '
      next: product-line
      enabled: true
  - id: w-card-product-class-pump-stations
    type: wizard/selection-card
    layout:
      x: 4
      y: 2
      w: 4
      h: 8
    props:
      stepId: product-class
      cardId: pump-stations
      title: Насосные установки
      description: 'Перекачка и повышение давления воды в системах хозяйственно-питьевого водоснабжения и пожаротушения.

        '
      next: product-line
      enabled: true
  - id: w-card-product-class-aupd
    type: wizard/selection-card
    layout:
      x: 8
      y: 2
      w: 4
      h: 8
    props:
      stepId: product-class
      cardId: aupd
      title: АУПД и АУПДЗ
      description: В разработке
      enabled: false
  - id: w-card-product-class-simpel
    type: wizard/selection-card
    layout:
      x: 0
      y: 10
      w: 4
      h: 8
    props:
      stepId: product-class
      cardId: simpel
      title: Насосы Simpel
      description: Подбор серийных насосов COMOS, CIVOS, VMIP, HMIP.
      enabled: true
  - id: w-heading-product-line
    type: wizard/step-heading
    layout:
      x: 0
      y: 0
      w: 12
      h: 2
    props:
      stepId: product-line
      title: Линейка насосных установок
      subtitle: Далее уточните тип сети — хоз-пит или ПНС
  - id: w-card-product-line-bps-w
    type: wizard/selection-card
    layout:
      x: 0
      y: 2
      w: 4
      h: 8
    props:
      stepId: product-line
      cardId: bps-w
      title: BPS-W
      description: —
      next: installation-type
      enabled: true
  - id: w-heading-installation-type
    type: wizard/step-heading
    layout:
      x: 0
      y: 0
      w: 12
      h: 2
    props:
      stepId: installation-type
      title: Тип установки
      subtitle: Выберите назначение установки
  - id: w-card-installation-type-domestic
    type: wizard/selection-card
    layout:
      x: 0
      y: 2
      w: 4
      h: 8
    props:
      stepId: installation-type
      cardId: domestic
      title: Хозяйственно-питьевая
      description: Водоснабжение, повышение давления в тупиковой сети.
      next: selection-form
      flow: bps-w-domestic
  - id: w-card-installation-type-fire-pns
    type: wizard/selection-card
    layout:
      x: 4
      y: 2
      w: 4
      h: 8
    props:
      stepId: installation-type
      cardId: fire-pns
      title: Пожарная насосная станция (ПНС)
      description: 'Пожаротушение: ВПВ, дренчерная, спринклерная.'
      next: selection-form
      flow: bps-w-fire
      enabled: false
