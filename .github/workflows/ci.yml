name: CI

on:
  pull_request:
  push:
    branches: [base, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        working-directory: apps/api
        run: |
          pip install -U pip wheel
          pip install -e ".[dev]"

      - name: Ruff
        working-directory: apps/api
        run: pip install ruff && ruff check app tests || true

      - name: Validate profile configs
        working-directory: apps/api
        run: python -m app.tools.validate_profile_config

      - name: Validate site grid
        working-directory: apps/api
        run: python -m app.tools.validate_site_grid

      - name: Validate algorithm wiring
        working-directory: apps/api
        run: python -m app.tools.validate_algorithm_wiring

      - name: Pytest
        working-directory: apps/api
        env:
          USE_MOCK_DB: "true"
          JWT_SECRET: test-secret
        run: pytest -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.0 --activate

      - name: Build web
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm typecheck
          pnpm build

      - name: Install Playwright
        run: pnpm add -D @playwright/test@1.49.1 -w && pnpm exec playwright install chromium

      - name: E2E smoke (optional)
        continue-on-error: true
        run: pnpm exec playwright test
