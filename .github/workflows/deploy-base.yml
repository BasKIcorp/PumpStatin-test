name: Deploy base branch

on:
  push:
    branches:
      - base

concurrency:
  group: deploy-83-222-16-200
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI gate
        uses: actions/github-script@v7
        with:
          script: |
            core.info('Deploy runs after merge to base; run CI workflow on PR first.')

      - name: CI gate — lint and test
        working-directory: apps/api
        env:
          USE_MOCK_DB: "true"
          JWT_SECRET: test-secret
        run: |
          pip install -U pip wheel
          pip install -e ".[dev]"
          python -m app.tools.validate_profile_config
          pytest -q

      - name: Create deployment archive
        run: |
          # Exit code 1 = "file changed as we read it" (harmless on CI checkout)
          tar -czf pumpstation-base.tar.gz \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=dist \
            --exclude=.venv \
            --exclude=__pycache__ \
            --exclude=.cursor/projects \
            --exclude=assets \
            . || test $? -eq 1

      - name: Upload archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          source: pumpstation-base.tar.gz
          target: /tmp/

      - name: Extract, build, and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            APP_ROOT=/opt/pumpstation-base
            STAGING=/tmp/pumpstation-stage-$$
            ENV_FILE="$APP_ROOT/deploy/production.env"
            ENV_BACKUP=""
            if [ -f "$ENV_FILE" ]; then
              ENV_BACKUP="$(cat "$ENV_FILE")"
            fi
            rm -rf "$STAGING"
            mkdir -p "$STAGING"
            tar -xzf /tmp/pumpstation-base.tar.gz -C "$STAGING"
            rm -rf "$APP_ROOT"
            mkdir -p "$APP_ROOT"
            cp -a "$STAGING/." "$APP_ROOT/"
            rm -rf "$STAGING"
            if [ -n "$ENV_BACKUP" ]; then
              mkdir -p "$APP_ROOT/deploy"
              printf '%s' "$ENV_BACKUP" > "$ENV_FILE"
            fi
            sed -i 's/\r$//' "$APP_ROOT"/deploy/*.sh
            bash "$APP_ROOT/deploy/remote-setup.sh"
            rm -f /tmp/pumpstation-base.tar.gz
